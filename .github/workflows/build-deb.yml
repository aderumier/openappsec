name: Debian package

# Repackages upstream's precompiled open-appsec installers as a .deb.
#
# Upstream ships makeself self-extracting shell installers and no distro
# package, so there is no apt install/upgrade/removal path and nothing to pin.
# This does not build from source: the binaries are upstream's own, which is
# deliberate - see packaging/deb/README.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      codename:
        description: "Debian codename to fetch upstream packages for"
        default: "trixie"
        type: string
      version:
        description: "Override the .deb version (default: upstream agent version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Repack .deb on Debian 13
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    permissions:
      contents: read
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl file git tar xz-utils

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch upstream agent packages
        id: fetch
        env:
          CODENAME: ${{ inputs.codename || 'trixie' }}
        run: |
          set -eu
          url="https://downloads.openappsec.io/packages/agent/x86_64/debian/${CODENAME}/openappsec-${CODENAME}.tar.gz"
          echo "fetching $url"
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o openappsec.tar.gz
          mkdir -p upstream
          tar xzf openappsec.tar.gz -C upstream --strip-components=1
          ls -la upstream/
          # The agent version is only stated in the makeself label.
          ver="$(grep -aoE 'Nano Agent Version [0-9.]+' upstream/install-cp-nano-agent.sh \
                 | head -1 | awk '{print $NF}')"
          [ -n "$ver" ] || { echo "could not read agent version" >&2; exit 1; }
          echo "agent_version=$ver" >> "$GITHUB_OUTPUT"
          echo "upstream agent version: $ver"

      - name: Determine package version
        id: ver
        env:
          AGENT_VERSION: ${{ steps.fetch.outputs.agent_version }}
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            # ~ sorts before everything, so untagged builds never outrank a release.
            v="${AGENT_VERSION}~$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package version: $v"

      - name: Build the .deb
        run: ./packaging/deb/build-deb.sh "${{ steps.ver.outputs.version }}" upstream dist

      # A container has no systemd, so nano_agent cannot start and orchestration
      # never writes its status files. Assert only what installation proves;
      # whether the agent inspects traffic must be tested on a real host, see
      # packaging/deb/README.md.
      - name: Install the .deb and verify the payload layout
        run: |
          apt-get install -y --no-install-recommends ./dist/*.deb
          test -d /etc/cp
          test -L /usr/sbin/open-appsec-ctl
          for d in agent http-transaction-handler attachment-registration-manager; do
            test -d "/usr/share/openappsec/$d" || { echo "missing payload: $d" >&2; exit 1; }
          done
          echo "files owned by the package: $(dpkg -L openappsec | wc -l)"
          echo "--- agent status (informational only: no systemd in a container) ---"
          open-appsec-ctl -s 2>&1 | head -20 || true

      - name: Removal must be clean
        run: |
          apt-get remove -y openappsec
          if [ -d /etc/cp ]; then
            echo "::warning::removal left /etc/cp behind"; ls -la /etc/cp | head
          fi
          test ! -d /usr/share/openappsec/agent

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openappsec-deb
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: openappsec-deb
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.deb --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.deb \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
